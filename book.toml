[book]
title = "ctara-dhruv-core"
description = "Clean-room ephemeris and jyotish computation library: JPL kernels, Vedic math, and every public surface (Rust, C ABI, CLI, Python, Node, Go, Elixir)."
authors = ["Govind"]
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Mr-Pental21/ctara-dhruv-core"
edit-url-template = "https://github.com/Mr-Pental21/ctara-dhruv-core/edit/main/{path}"

[output.html.search]
enable = true
limit-results = 20

[output.html.fold]
enable = true
level = 1
